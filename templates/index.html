<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locum Tracker</title>
</head>
<body>
    <h1>Locum Tracker</h1>

     <h2>Log a shift</h2>
    <form method="post" action="/add">
        <p>
            <label for="shift_date">Date</label>
            <input type="date" id="shift_date" name="shift_date" required>
        </p>
        <p>
            <label for="hours">Hours worked</label>
            <input type="number" id="hours" name="hours" step="0.25" min="0" required>
        </p>
        <p>
            <label for="hourly_rate">Hourly rate (£)</label>
            <input type="number" id="hourly_rate" name="hourly_rate" step="0.01" min="0" required>
        </p>
        <button type="submit">Save shift</button>
    </form>

</body>
</html>
